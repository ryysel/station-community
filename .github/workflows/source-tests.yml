name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: agent/go.sum
      - run: python3 tools/audit_export.py
      - run: python3 -m unittest discover -s tools -v
      - run: go test ./... && go vet ./...
        working-directory: agent
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o "$RUNNER_TEMP/station-agent-arm" .
        working-directory: agent
      - run: sudo apt-get update -qq && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config
      - run: make test && make clean
        working-directory: airplay/group-volume
      - run: python3 tools/audit_export.py
